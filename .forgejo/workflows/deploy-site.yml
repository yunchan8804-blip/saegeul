# 새글 사이트(site/) → Cloudflare Pages `saegul` (saegul.chanpaca.net) 배포의 유일한 경로.
# 2026-10-11에 GitHub Actions(.github/workflows/pages.yml)에서 옮겼다(docs/decisions/0001-git-host-forgejo.md).
# Pages 프로젝트는 Git 연동이 아니라 직접 업로드 방식이라, push만으로는 배포되지 않고 wrangler가 site/를 올린다.
#
# 필요한 Forgejo 저장소 Secrets (Settings → Actions → Secrets): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy Saegeul site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".forgejo/workflows/deploy-site.yml"
  workflow_dispatch:

# 나중 배포가 먼저 끝나 옛 산출물이 최종본이 되지 않게 순서대로 흘린다.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 러너(호스트 실행)의 기본 Node는 18이라 Node 22 이상을 요구하는 wrangler 4가 돌지 않는다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 배포 자격증명 확인
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          missing=""
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!key}" ] || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "시크릿 누락:$missing (Forgejo 저장소 Settings → Actions → Secrets)" >&2
            exit 1
          fi

      - name: Cloudflare Pages 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # cloudflare/wrangler-action은 GitHub 전용이라 wrangler를 정확 버전으로 직접 실행한다.
        run: >-
          npx --yes wrangler@4.127.1 pages deploy site
          --project-name=saegul
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-message="forgejo deploy ${{ github.sha }}"

      - name: 공개 사이트 확인
        shell: bash
        run: |
          for path in "" privacy/ faq/ source/; do
            curl --fail --silent --show-error --retry 5 --retry-delay 6 \
              "https://saegul.chanpaca.net/$path" --output /dev/null
          done
