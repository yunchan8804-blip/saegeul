name: Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      # pull request's head branch was updated
      - synchronize

jobs:
  build_pull_request:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Android build
        uses: ./.github/actions/setup-android-build

      - name: Verify developer tests and user compilation
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Build developer APK
        run: |
          ./gradlew :app:assembleDebug
          ./gradlew :assembleDebugPlugins

      - name: Upload developer app
        uses: actions/upload-artifact@v6
        with:
          name: developer-app
          path: app/build/outputs/apk/debug/
          retention-days: 7

      - name: Pack developer plugins
        shell: bash
        run: |
          mkdir plugins-to-upload
          mv plugin/hangul/build/outputs/apk/debug plugins-to-upload/hangul

      - name: Upload developer plugins
        uses: actions/upload-artifact@v6
        with:
          name: developer-plugins
          path: plugins-to-upload
          retention-days: 7
