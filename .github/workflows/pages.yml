name: Deploy Saegeul site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # saegul.chanpaca.net is served by the Cloudflare Pages project `saegul`, which uses
      # direct upload rather than a Git integration. A push therefore cannot deploy it on its
      # own; Wrangler uploads site/ against the project's production branch.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name saegul --branch main
      - name: Report deployment
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
