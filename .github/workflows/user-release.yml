name: Saegeul user release candidate

on:
  push:
    tags:
      - "saegeul-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated Saegeul tag to build
        required: true
        type: string

permissions:
  # write is required by the publish step, which creates the release for the built tag.
  contents: write

concurrency:
  group: user-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-user-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SIGN_KEY_BASE64: ${{ secrets.SAEGEUL_UPLOAD_KEYSTORE_BASE64 }}
      SIGN_KEY_PWD: ${{ secrets.SAEGEUL_UPLOAD_KEY_PASSWORD }}
      SIGN_KEY_ALIAS: ${{ secrets.SAEGEUL_UPLOAD_KEY_ALIAS }}
    steps:
      - name: Fetch exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify annotated tag
        shell: bash
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Require signing secrets
        shell: bash
        run: |
          test -n "$SIGN_KEY_BASE64"
          test -n "$SIGN_KEY_PWD"
          test -n "$SIGN_KEY_ALIAS"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install native build dependencies
        shell: bash
        run: |
          sdkmanager --install "cmake;3.31.6"
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test developer contract
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build signed user APK AAB and Hangul plugin
        shell: bash
        run: |
          version="${RELEASE_TAG#saegeul-v}"
          ./gradlew \
            :app:assembleRelease \
            :app:bundleRelease \
            :plugin:hangul:assembleRelease \
            "-PbuildVersionName=$version" \
            "-PSOURCE_TAG=$RELEASE_TAG" \
            --no-daemon \
            --console=plain

      - name: Stage and verify release bundle
        shell: pwsh
        run: |
          $release = Join-Path $PWD "release"
          New-Item -ItemType Directory -Path $release -Force | Out-Null

          $mainApk = Get-ChildItem app/build/outputs/apk/release/*.apk
          $mainAab = Get-ChildItem app/build/outputs/bundle/release/*.aab
          $hangulApk = Get-ChildItem plugin/hangul/build/outputs/apk/release/*.apk
          $metadata = Get-Item app/build/outputs/apk/release/build-metadata.json
          if (
            @($mainApk).Count -ne 1 -or
            @($mainAab).Count -ne 1 -or
            @($hangulApk).Count -ne 1
          ) {
            throw "Expected exactly one app APK, app AAB, and Hangul APK."
          }
          Copy-Item $mainApk.FullName,$mainAab.FullName,$hangulApk.FullName,$metadata.FullName $release

          ./scripts/create-source-archive.ps1 `
            -Ref $env:RELEASE_TAG `
            -OutputDirectory $release

          $source = Get-Item (Join-Path $release "$($env:RELEASE_TAG)-source.tar.gz")
          $sourceUrl = "https://github.com/yunchan8804-blip/saegeul/releases/download/" +
            "$($env:RELEASE_TAG)/$($source.Name)"
          ./scripts/verify-release-bundle.ps1 `
            -ReleaseDirectory $release `
            -MainApkPath (Join-Path $release $mainApk.Name) `
            -MainAabPath (Join-Path $release $mainAab.Name) `
            -HangulApkPath (Join-Path $release $hangulApk.Name) `
            -BuildMetadataPath (Join-Path $release $metadata.Name) `
            -SourceArchivePath $source.FullName `
            -SourceTag $env:RELEASE_TAG `
            -SbomOutputPath (Join-Path $release "$($env:RELEASE_TAG)-sbom.cdx.json") `
            -ProductName "Saegeul" `
            -ApplicationId "net.chanpaca.saegeul" `
            -SourceRepositoryUrl "https://github.com/yunchan8804-blip/saegeul" `
            -PrivacyPolicyUrl "https://saegul.chanpaca.net/privacy/" `
            -SourceArchiveUrl $sourceUrl `
            -SigningCertificateSha256 "3B:08:8B:5C:6A:69:E3:6C:62:80:2E:F5:D4:33:BD:9D:84:5B:8E:98:09:27:8E:13:13:36:A5:03:DA:90:1A:66"

          Get-ChildItem $release -File |
            Where-Object Name -ne "SHA256SUMS" |
            ForEach-Object {
              "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
            } | Set-Content (Join-Path $release "SHA256SUMS") -Encoding utf8NoBOM

      - name: Upload verified user release candidate
        uses: actions/upload-artifact@v6
        with:
          name: user-release-${{ env.RELEASE_TAG }}
          path: release/
          retention-days: 30
          if-no-files-found: error

      # Artifacts expire after 30 days and are not reachable without a GitHub login, so the
      # verified bundle is also published as a release. This runs only after every verification
      # step above has passed, which is what keeps an unverified build off the release page.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${RELEASE_TAG#saegeul-v}"
          # A semver pre-release identifier ("0.1.0-rc.10") marks the release as a pre-release,
          # while a plain version ("0.1.1") publishes as the latest release.
          prerelease=()
          case "$version" in
            *-*) prerelease=(--prerelease) ;;
          esac

          # The annotated tag body is the changelog; the trailer is identical every release.
          notes="$(mktemp)"
          {
            body="$(git tag -l --format='%(contents:body)' "$RELEASE_TAG")"
            if [ -n "$body" ]; then
              printf '%s\n\n' "$body"
            fi
            cat <<'TRAILER'
          설치할 때 Play Protect가 "안전하지 않은 앱"으로 경고하면 자세히 > 무시하고 설치를 누르면 돼. Google Play를 거치지 않은 앱이라 뜨는 경고이고, 자세한 절차와 서명 지문 확인 방법은 https://saegul.chanpaca.net/faq/ 에 있어.

          - 사용자 앱: `net.chanpaca.saegeul`
          - 한글 플러그인: `net.chanpaca.saegeul.plugin.hangul`
          - 두 APK를 같은 태그에서 함께 설치해야 한글 엔진이 잡혀
          - 동일 태그 전체 소스, SBOM, SHA256SUMS 동시 제공

          새글은 Fcitx5 기반의 비공식 독립 포크이며 원 프로젝트와 제휴·보증 관계가 없어.
          TRAILER
          } > "$notes"

          # Re-running the workflow for a tag that was already published must refresh the assets
          # instead of failing outright.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "Saegeul $version" \
              --notes-file "$notes" \
              --verify-tag \
              "${prerelease[@]}" \
              release/*
          fi
